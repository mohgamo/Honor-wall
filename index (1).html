<!DOCTYPE html>
<html lang="en" dir="ltr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Honor Wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--plum:#5b2448;--gold:#b8924a;--gold2:#e6cf94;--ink:#3a1f33;--muted:#8a7684;--card:#fffaf8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Nunito,sans-serif;color:var(--ink);min-height:100vh;
background:linear-gradient(180deg,#f3dfe4 0%,#efe6ee 45%,#f6eee9 100%);padding:24px 14px 60px}
.wrap{max-width:560px;margin:0 auto}
header{text-align:center}
header img{width:70px;margin-bottom:6px}
.trophy{font-size:44px}
h1{font-family:'Fredoka',sans-serif;font-size:56px;line-height:1.1;
background:linear-gradient(90deg,#d8bd7a,#9c7536,#d8bd7a);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:20px;margin-top:4px}
.tabs{margin:22px auto 14px;background:#fff8;border:1px solid #fff;border-radius:40px;padding:10px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;box-shadow:0 6px 20px #5b244814}
.tabs button{font:600 18px Nunito;border:0;background:none;color:var(--ink);padding:10px 18px;border-radius:30px;cursor:pointer}
.tabs button.on{background:var(--plum);color:#fff;box-shadow:0 6px 14px #5b244855}
.hint{background:#fffc;border-radius:30px;padding:12px;text-align:center;font-size:17px;box-shadow:0 4px 14px #5b24480f}
h2{font-family:'Fredoka';text-align:center;font-size:32px;margin:30px 0 10px}
h2 b{color:var(--gold)}
.podium{display:grid;grid-template-columns:1fr 1.25fr 1fr;align-items:end;gap:10px;margin-top:10px}
.pl{text-align:center;cursor:pointer}
.ring{margin:0 auto;border-radius:50%;display:grid;place-items:center;background:#fff;font-family:'Fredoka'}
.ring span{display:block;font-size:14px;color:var(--muted)}
.ring strong{font-size:26px}
.p1 .ring{width:150px;height:150px;border:14px solid #c9a65a;box-shadow:0 0 0 4px #f3e3b5,0 10px 30px #b8924a55}
.p1 .ring strong{font-size:34px}
.p2 .ring{width:112px;height:112px;border:11px solid #b8bfcb}
.p3 .ring{width:112px;height:112px;border:11px solid #b07a4f}
.deco{font-size:34px;height:44px}
.nm{font-family:'Fredoka';font-size:21px;margin-top:10px;border-bottom:3px solid var(--gold2);display:inline-block}
.pts{color:var(--muted);font-size:15px;margin:6px 0 10px}
.block{border-radius:16px 16px 6px 6px;display:grid;place-items:center;font-size:42px}
.p1 .block{height:150px;background:linear-gradient(#d9b867,#b48c3e)}
.p2 .block{height:105px;background:linear-gradient(#dfe3ea,#a9b0bd)}
.p3 .block{height:85px;background:linear-gradient(#d3a37a,#9b6a43)}
.list{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:22px;padding:14px 16px;box-shadow:0 4px 14px #5b24480d;cursor:pointer}
.rk{width:48px;height:48px;border-radius:50%;border:2px solid var(--gold2);display:grid;place-items:center;font:700 20px 'Fredoka';color:var(--gold);flex:none}
.info{flex:1;min-width:0}
.info .n{font-family:'Fredoka';font-size:20px}
.info .n small{font-family:Nunito;color:var(--muted);font-size:14px;margin-inline-start:8px}
.bar{height:9px;background:#ece6ea;border-radius:9px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#d8bd7a,#b07890,#5b2448)}
.place{font:700 20px 'Fredoka';white-space:nowrap}
.cls{font-size:13px;color:var(--gold);font-weight:700}
footer{text-align:center;color:var(--muted);margin-top:34px;font-size:15px}
.modal{position:fixed;inset:0;background:#2a0f22cc;display:none;align-items:center;justify-content:center;padding:14px;z-index:9}
.modal.on{display:flex}
.box{background:#fff;border-radius:18px;padding:12px;max-width:760px;width:100%;text-align:center}
.box img{width:100%;border-radius:10px;display:block}
.box p{margin:10px 0 6px;color:var(--muted);font-size:15px}
.box button{font:700 17px Nunito;background:var(--plum);color:#fff;border:0;border-radius:24px;padding:10px 30px;cursor:pointer}

.editbtn{position:fixed;bottom:18px;left:18px;font:700 16px Nunito;background:var(--plum);color:#fff;border:0;border-radius:30px;padding:12px 20px;box-shadow:0 8px 20px #5b244866;cursor:pointer;display:none;z-index:5}
.ed{position:fixed;inset:0;background:#f6eef0;z-index:10;display:none;overflow:auto;padding:16px 12px 120px}
.ed.on{display:block}
.ed h3{font-family:'Fredoka';font-size:26px;text-align:center;color:var(--plum)}
.ed .tip{text-align:center;color:var(--muted);font-size:14px;margin:4px 0 12px}
.erow{display:flex;align-items:center;gap:6px;background:#fff;border-radius:14px;padding:8px;margin-bottom:8px}
.erow input.nm{flex:1;min-width:0;font:500 16px Nunito;border:1px solid #e8dde3;border-radius:10px;padding:8px}
.erow input.pt{width:62px;text-align:center;font:700 17px Nunito;border:1px solid #e8dde3;border-radius:10px;padding:8px}
.erow button{width:36px;height:36px;border-radius:50%;border:0;font:700 20px Nunito;cursor:pointer;flex:none}
.plus{background:#e7f3e8;color:#2c7a3a}.minus{background:#fbeaea;color:#a33}.del{background:none;color:#b9a;font-size:18px!important}
.ebar{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:12px;display:flex;gap:8px;justify-content:center;box-shadow:0 -6px 20px #5b24481a;z-index:11}
.ebar button{font:700 17px Nunito;border:0;border-radius:24px;padding:12px 22px;cursor:pointer}
.save{background:var(--plum);color:#fff}.cancel{background:#eee;color:var(--ink)}.add{background:#f3e9d2;color:#7a5a1e}
.estat{text-align:center;font-size:14px;color:var(--plum);min-height:20px;margin-top:6px}
.upd{text-align:center;color:var(--muted);font-size:13px;margin-top:8px}
</style></head><body><div class="wrap">

 x.font='700 96px "Fredoka"';x.fillText('Certificate of Excellence',W/2,240);
 x.fillStyle='#3a1f33';x.font='500 42px Nunito';x.fillText('This certificate is proudly presented to the outstanding student',W/2,350);
 x.fillStyle='#5b2448';let fs=104;do{x.font='700 '+fs+'px "Fredoka"';fs-=4}while(x.measureText(s.n).width>W-260&&fs>40);x.fillText(s.n,W/2,500);
 x.fillStyle='#e6cf94';x.fillRect(W/2-300,530,600,6);
 x.fillStyle='#3a1f33';x.font='500 42px Nunito';
 const where=cur==="all"?`across ${GRADE}`:`in Class ${s.c}`;
 x.fillText(`for achieving ${ordOf(i)} place ${where} with ${s.p} points`,W/2,620);
 x.fillText('in English, in recognition of her excellence and active participation.',W/2,690);
 x.fillText('Wishing her continued success! 🌟',W/2,760);
 x.font='700 38px Nunito';x.fillStyle='#5b2448';x.textAlign='left';x.fillText('Teacher',160,900);
 x.font='500 36px Nunito';x.fillStyle='#3a1f33';x.fillText(TEACHER,160,960);
 x.textAlign='right';x.font='72px serif';x.fillText(i===0?'🥇':i===1?'🥈':i===2?'🥉':'⭐',W-180,960);
 document.getElementById('cert').src=c.toDataURL('image/png');document.getElementById('modal').classList.add('on');
}
